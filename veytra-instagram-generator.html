/* ─── RENDER HELPERS ─────────────────────────────────────────────── */

function capsule(cx, cy, w, h, rot, isNavy) {
  const grad = isNavy
    ? 'linear-gradient(155deg,#2C456E 0%,#1B2A4A 55%,#0F1B30 100%)'
    : 'linear-gradient(155deg,#4A7C28 0%,#2D5016 55%,#1C3A0A 100%)';
  const shineW = Math.round(w * 0.22);
  const shineH = Math.round(h * 0.22);
  return `<div style="position:absolute;left:${cx}px;top:${cy}px;width:${w}px;height:${h}px;border-radius:${w/2}px;background:${grad};box-shadow:5px 10px 28px rgba(0,0,0,0.22),inset 0 2px 0 rgba(255,255,255,0.1);transform:translate(-50%,-50%) rotate(${rot}deg);">
    <div style="position:absolute;top:50%;left:0;right:0;height:1.5px;background:rgba(255,255,255,0.18);transform:translateY(-50%);"></div>
    <div style="position:absolute;top:15px;left:13px;width:${shineW}px;height:${shineH}px;border-radius:50%;background:rgba(255,255,255,0.11);"></div>
  </div>`;
}

    ${capsule(635, 175, 62, 178, 18,  isNavy)}
    ${capsule(450, 195, 56, 162, -28, isNavy)}
  `;
}

/* ─── MAIN RENDER ────────────────────────────────────────────────── */
function render() {
  const t = TEMPLATES[currentTemplate];
  const v = t.variants[currentVariant];

  let html = '';
  switch (currentTemplate) {
    case 'hero':      html = renderHero(v);      break;
    case 'botanical': html = renderBotanical(v);  break;
    case 'split':     html = renderSplit(v);      break;
    case 'quote':     html = renderQuote(v);      break;
    case 'stat':      html = renderStat(v);       break;
  }

  document.getElementById('post-canvas').innerHTML  = html;
  document.getElementById('caption-box').textContent  = v.cap;
  document.getElementById('hashtags-box').textContent = v.tag;
}

/* ─── UI CONTROLS ────────────────────────────────────────────────── */
function buildVariantPills() {
  const t     = TEMPLATES[currentTemplate];
  const wrap  = document.getElementById('variant-pills');
  wrap.innerHTML = t.variants.map((v, i) =>
    `<button class="vpill${i === currentVariant ? ' active' : ''}" onclick="selectVariant(${i})">${v.label}</button>`
  ).join('');
}

function selectTemplate(key) {
  if (key === currentTemplate) return;
  currentTemplate = key;
  currentVariant  = 0;
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.toggle('active', b.dataset.t === key));
  buildVariantPills();
  render();
}

function selectVariant(i) {
  currentVariant = i;
  document.querySelectorAll('.vpill').forEach((p, idx) => p.classList.toggle('active', idx === i));
  render();
}

/* ─── DOWNLOAD ───────────────────────────────────────────────────── */
async function downloadPost() {
  const btn = document.getElementById('btn-dl');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  await document.fonts.ready;

  const orig  = document.getElementById('post-canvas');
  const clone = orig.cloneNode(true);

  Object.assign(clone.style, {
    position: 'fixed',
    left: '-99999px',
    top: '0',
    width: '1080px',
    height: '1080px',
    transform: 'none',
    transformOrigin: 'top left'
  });
  document.body.appendChild(clone);

  try {
    await new Promise(r => setTimeout(r, 250));

    const canvas = await html2canvas(clone, {
      width: 1080,
      height: 1080,
      scale: 1,
      useCORS: true,
      allowTaint: true,
      logging: false,
      backgroundColor: null
    });

    const t  = TEMPLATES[currentTemplate];
    const v  = t.variants[currentVariant];
    const nm = `veytra-${currentTemplate}-${v.label.toLowerCase().replace(/\s+/g,'-')}.png`;

    const a = document.createElement('a');
    a.download = nm;
    a.href = canvas.toDataURL('image/png');
    a.click();

  } catch (e) {
    console.error(e);
    alert('Download failed — please try again.');
  } finally {
    document.body.removeChild(clone);
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v8M3 6.5l3.5 3.5 3.5-3.5M1 11.5h11" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Download PNG`;
    btn.disabled = false;
  }
}

/* ─── COPY ───────────────────────────────────────────────────────── */
async function copyText(text, btnId, originalLabel) {
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById(btnId);
    btn.textContent = '✓ Copied!';
    btn.classList.add('success');
    setTimeout(() => {
      btn.textContent = originalLabel;
      btn.classList.remove('success');
    }, 2000);
  } catch (e) {
    alert('Copy failed — please copy the text manually.');
  }
}

function copyCaption() {
  const v = TEMPLATES[currentTemplate].variants[currentVariant];
  copyText(v.cap, 'btn-cap', 'Copy Caption');
}

function copyHashtags() {
  const v = TEMPLATES[currentTemplate].variants[currentVariant];
  copyText(v.tag, 'btn-tag', 'Copy Hashtags');
}

/* ─── INIT ───────────────────────────────────────────────────────── */
buildVariantPills();
render();

</script>
